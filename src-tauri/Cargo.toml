[package]
name = "studyus_app"
version = "0.1.0"
description = "Studyus desktop app — pdfium-backed curriculum text+math ingestion"
authors = ["Studyus"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "studyus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# PDF page rasterization. OpenStax renders math as vector drawings, so text
# extraction is not viable — we send rendered PNG pages to the vision LLM.
# pdfium-render dynamically loads pdfium.dll at runtime; the DLL is vendored at
# `src-tauri/pdfium/pdfium.dll` and copied next to the built exe by build.rs.
pdfium-render = { version = "0.9.2", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
# PNG encoding for PDFium's raster output + resize+normalize for the vision encoder.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Encode rendered PNG pages into base64 strings for IPC to the frontend, which
# posts them as `data:image/png;base64,...` URLs in vision LLM image_url parts.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dotenvy = "0.15"
# ONNX Runtime for local Granite Docling inference (CPU-only).
# ort is the official Rust binding; 2.0-rc.12 has a clean session-builder API.
# We disable default features and enable only the CPU execution provider to keep
# the binary lean and avoid pulling in CUDA/DirectML/TensorRT kernels.
ort = "2.0.0-rc.12"
ndarray = "0.17"
regex-lite = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
strip = true
