[package]
name = "studyus_app"
version = "0.1.0"
description = "Studyus desktop app — pdfium-backed curriculum text+math ingestion"
authors = ["Studyus"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "studyus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "memory_budget"
path = "tools/memory_budget.rs"

[[bin]]
name = "ocr_benchmark"
path = "tools/ocr_benchmark.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# PDF page rasterization. OpenStax renders math as vector drawings, so text
# extraction is not viable — we send rendered PNG pages to the vision LLM.
# pdfium-render dynamically loads pdfium.dll at runtime; the DLL is vendored at
# `src-tauri/pdfium/pdfium.dll` and copied next to the built exe by build.rs.
pdfium-render = { version = "0.9.2", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
# PNG encoding for PDFium's raster output + resize+normalize for the vision encoder.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Encode rendered PNG pages into base64 strings for IPC to the frontend, which
# posts them as `data:image/png;base64,...` URLs in vision LLM image_url parts.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# HuggingFace Hub download API — handles Xet storage, redirects, CDN resolution,
# and auth headers correctly. The blocking feature provides HFClientSync which
# manages its own multi-threaded tokio runtime (needed for Xet transfers) so it
# works safely inside Tauri's async runtime without conflicts.
hf-hub = { version = "1.0.0", features = ["blocking"] }
dotenvy = "0.15"
# Document extraction via PP-OCR (layout, table, formula, text OCR).
# oar-ocr wraps ONNX models for fast CPU-only inference (~0.2-2s/page vs 96s for Granite).
# auto-download feature downloads models from ModelScope on first use.
oar-ocr = { version = "0.9.2", features = ["auto-download"] }
# Memory pressure probe for the memory_budget standalone tool. Used at runtime
# to decide whether the OS has enough headroom to safely load the OCR bundle.
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
strip = true

[dev-dependencies]
# Memory pressure guard for the test suite. Used by `cargo test memory_budget`
# to refuse to load models on a machine with <200MB free RAM. We mock the
# syscall in unit tests so the suite does not depend on real RSS readings.
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
